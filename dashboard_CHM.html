<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BBS - Logistik</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <!-- === CSS STYLING === -->
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Styling Welcome Screen */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b132b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            gap: 20px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .welcome-title-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #00e5ff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .welcome-main-title {
            font-size: 32px;
            color: #ffd700;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            letter-spacing: 1px;
        }

        .btn-masuk {
            background: linear-gradient(135deg, #00e5ff, #00bcd4);
            color: #0b132b;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-masuk:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 229, 255, 0.6);
        }

        .view-container {
            display: none; 
            flex-direction: column;
            gap: 20px;
        }

        /* Header Dashboard */
        .dashboard-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            gap: 15px;
        }

        /* Teks Berjalan (Marquee) */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 10px 0;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .marquee-text {
            display: inline-block;
            animation: marquee 25s linear infinite;
            font-size: 16px;
            font-weight: bold;
            color: #ff9800;
            font-family: 'Poppins', sans-serif;
        }

        .marquee-text:hover {
            animation-play-state: paused;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* Efek Hijau Menyala Kelap-Kelip untuk Bullet */
        .neon-bullet {
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
            animation: blink-neon 1.2s ease-in-out infinite;
        }

        @keyframes blink-neon {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
            }
            50% {
                opacity: 0.2;
                text-shadow: none;
            }
        }

        /* Wrapper Jam & Tanggal / Total BOP (Flex Space Between) */
        .clock-date-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .left-info-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        #live-clock {
            font-size: 32px;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        /* Styling khusus untuk teks detik agar lebih kecil */
        #live-seconds {
            font-size: 16px;
            color: #00bcd4;
            font-weight: normal;
        }

        #live-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Styling Total BOP di Kanan */
        .right-bop-group {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            text-align: right;
        }

        .bop-title {
            font-size: 11px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
        }

        #total-bop-amount {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* Container Utama untuk Daftar Unit (Grid Dashboard) */
        #log-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 10px;
            max-height: 70vh;
            overflow-y: auto;
            background: rgba(10, 15, 30, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        /* Scrollbar Styling */
        #log-list::-webkit-scrollbar {
            width: 8px;
        }
        #log-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        #log-list::-webkit-scrollbar-thumb {
            background: #00e5ff;
            border-radius: 4px;
        }

        /* Desain Kartu Unit (Truck Card) */
        .truck-card {
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.85), rgba(36, 59, 85, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
        }

        .truck-card:hover {
            transform: translateY(-3px);
            border-color: #00e5ff;
            box-shadow: 0 6px 15px rgba(0, 229, 255, 0.15);
        }

        /* Header Kartu */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .sj-number {
            font-size: 11px;
            font-weight: bold;
            color: #00e5ff;
            font-family: monospace;
        }
        .info-waktu {
            font-size: 10px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Bagian Isi Kartu */
        .plat-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .plat-text {
            font-size: 15px;
            font-weight: bold;
            color: #FFF;
        }
        .project-badge {
            font-size: 10px;
            font-weight: bold;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            padding: 1px 5px;
            border-radius: 3px;
        }

        .vol-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            font-weight: bold;
        }
        .vol-m {
            color: #2ecc71;
            background: rgba(46, 204, 113, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(46, 204, 113, 0.2);
        }
        .vol-b {
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .info-item {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 4px;
        }
        .info-item.bop { color: #ffd700; }
        .info-item.jual { color: #00e5ff; }
        .info-item.margin { color: #2ecc71; }

        .foto-links {
            font-size: 11px;
            margin-top: 6px;
            margin-bottom: 8px;
        }
        .foto-links a {
            color: #4caf50;
            font-weight: bold;
            text-decoration: none;
        }
        .foto-links a:hover {
            text-decoration: underline;
        }

        /* Tombol & Status di Bawah Kartu */
        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .btn-otw {
            background: #FF9800;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn-otw:hover {
            background: #f57c00;
        }
        .badge-done {
            background: #4CAF50;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            display: block;
            width: 100%;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }
        .selisih-wrapper {
            width: 100%;
            text-align: center;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-title-group">
            <span class="welcome-subtitle">MONITORING TRUCK</span>
            <span class="welcome-main-title">PT. BERKAH BAJA STEEL</span>
        </div>
        <button id="btn-masuk-system" class="btn-masuk">MASUK SYSTEM</button>
    </div>

    <!-- Tampilan Mode Cilegon -->
    <div id="view-cilegon" class="view-container">
        <h2>Dashboard Cilegon</h2>
    </div>

    <!-- Tampilan Mode Utama -->
    <div id="view-dashboard" class="view-container">
        <!-- Header dengan Teks Berjalan & Efek Neon Hijau Berkedip pada Simbol Titik -->
        <div class="dashboard-header">
            <div class="marquee-container">
                <div class="marquee-text">
                    MONITORING TRUCKING PT. BERKAH BAJA STEEL <span class="neon-bullet">&nbsp;&bull;&nbsp;</span> TOTAL TRUCK DIJALAN : ⟪ <span id="d-count-otw">0</span> UNIT ⟫ <span class="neon-bullet">&nbsp;&bull;&nbsp;</span> HARAP CEK BERKALA STATUS PENGIRIMAN UNIT
                </div>
            </div>
            
            <div class="clock-date-wrapper">
                <!-- Sisi Kiri: Jam & Tanggal -->
                <div class="left-info-group">
                    <div id="live-clock">
                        <span id="live-time-main">00.00</span><span id="live-seconds">.00</span>
                    </div>
                    <div id="live-date">--/--/----</div>
                </div>

                <!-- Sisi Kanan: Total BOP Hari Ini -->
                <div class="right-bop-group">
                    <div class="bop-title">Total BOP Hari Ini</div>
                    <div id="total-bop-amount">RP 0</div>
                </div>
            </div>
        </div>

        <div id="log-list"></div>
    </div>

    <!-- === JAVASCRIPT & FIREBASE SDK === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAfeLTKRQ66tjZjAt7tg6KcrWhtmv0y3fo", 
            databaseURL: "https://berkah-baja-steel-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "berkah-baja-steel" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbKey = "CHM";

        // Fungsi untuk Masuk System & Fullscreen
        document.getElementById('btn-masuk-system').addEventListener('click', () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log("Fullscreen error:", err);
                });
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            document.getElementById('welcome-screen').style.display = 'none';

            const mode = new URLSearchParams(window.location.search).get('mode');
            if(mode === 'cilegon') {
                document.getElementById('view-cilegon').style.display = 'flex';
            } else {
                document.getElementById('view-dashboard').style.display = 'flex';
            }
        });

        // Pengaturan Mode Tampilan (Hanya sembunyikan welcome screen jika auto-bukan dari klik, tapi karena pakai welcome screen kita biarkan welcome screen tampil dulu)

        // Fungsi Jam, Menit, Detik & Tanggal Real-Time
        function updateClockAndDate() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('live-time-main').innerText = `${hours}.${minutes}`;
            document.getElementById('live-seconds').innerText = `.${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', options);
        }
        
        updateClockAndDate();
        setInterval(updateClockAndDate, 1000);

        let rawData = [];

        onValue(ref(db, `bbs_logs/${dbKey}`), async (snap) => {
            const data = snap.val();
            let tm = 0, tb = 0, otw = 0, totalBopToday = 0; 
            rawData = [];
            const list = document.getElementById('log-list');
            if (!list) return;
            list.innerHTML = "";
            
            let counterSjRef = ref(db, `bbs_counter_sj/${dbKey}`);
            let counterSnap = await get(counterSjRef);
            let currentCounter = counterSnap.exists() ? Number(counterSnap.val()) : 70;

            if(data) {
                const romawiBulan = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
                const d = new Date();
                const bulanRomawi = romawiBulan[d.getMonth()];
                const tahunSekarang = d.getFullYear();

                const keys = Object.keys(data);
                const totalData = keys.length;
                
                keys.forEach((k, index) => {
                    const i = data[k];
                    const statusMobil = (i.status || "").toUpperCase();
                    
                    if(statusMobil === 'ARCHIVED') return;

                    tm += Number(i.volM || 0); 
                    tb += Number(i.volB || 0); 
                    totalBopToday += Number(i.bop_unit || 0); // Menghitung akumulasi total BOP
                    rawData.push({ ...i, firebaseKey: k });
                    
                    let statusElement = "";
                    if(statusMobil === 'OTW') {
                        otw++;
                        statusElement = `
                            <button onclick="openOtwManager('${k}', '${i.plat}')" class="btn-otw">
                                ${statusMobil} ( PROSES BONGKAR )
                            </button>
                        `;
                    } else {
                        statusElement = `
                            <span class="badge-done">
                                ✅ ${i.status}
                            </span>
                        `;
                    }

                    let nomorSuratJalanLengkap = i.noSuratJalan || i.nomor_surat_jalan || i.surat_jalan || i.no_sj;
                    if (!nomorSuratJalanLengkap || nomorSuratJalanLengkap === '-' || nomorSuratJalanLengkap.includes('000/bbs')) {
                        const estimatedNo = currentCounter - totalData + (index + 1);
                        const safeNo = estimatedNo > 0 ? estimatedNo : (index + 1);
                        const stringNomorUrut = String(safeNo).padStart(3, '0');
                        nomorSuratJalanLengkap = `${stringNomorUrut}/bbs/${bulanRomawi}/${tahunSekarang}`;
                    }
                    
                    const jamMuat = i.jamM || i.jam_muat || i.jam || '';
                    const tglMuat = i.tgl || i.tglM || i.tanggal || '-';
                    const infoWaktu = jamMuat ? `${jamMuat} ※ ${tglMuat}` : tglMuat;
                    
                    list.innerHTML += `
                    <div class="truck-card">
                        <div class="card-header">
                            <span class="sj-number">${nomorSuratJalanLengkap}</span>
                            <span class="info-waktu">${infoWaktu}</span>
                        </div>

                        <div class="card-body">
                            <div class="plat-row">
                                <span class="plat-text">${i.plat}</span> 
                                <span class="project-badge">[${i.project || 'LOSARANG'}]</span>
                            </div>

                            <div class="vol-row">
                                <span class="vol-m">VOL M : ${i.volM || 0} M³</span>
                                <span class="vol-b">VOL B : ${i.volB || 0} M³</span>
                            </div>
                            
                            <div class="info-item">
                                MUATAN <b>${i.barang ? i.barang.toUpperCase() : '-'}</b>
                            </div>

                            <div class="info-item">
                                PENGEMUDI : <b>${i.sopir}</b>
                            </div>

                            <div class="info-item bop">
                                💰 BOP : RP ${(i.bop_unit || 0).toLocaleString('id-ID')}
                            </div>

                            <div class="info-item jual">
                                🏷️ HARGA JUAL : RP ${(i.harga_jual || i.hargaJual || i.harga || 0).toLocaleString('id-ID')}
                            </div>
                            
                            ${i.margin_per_unit ? `
                            <div class="info-item margin">
                                📈 MARGIN : RP ${i.margin_per_unit.toLocaleString('id-ID')}
                            </div>
                            ` : ''}
                            
                            <div class="foto-links">
                                <a href="${i.fotoM}" target="_blank">📄 FOTO SAAT LOADING</a> 
                                ${i.fotoB ? `| <a href="${i.fotoB}" target="_blank">📄 FOTO BONGKAR</a>` : ''}
                            </div>
                        </div>
                        
                        <div class="card-footer">
                            ${statusElement}
                            <div class="selisih-wrapper">
                                ${typeof getBadgeSelisih === 'function' ? getBadgeSelisih(i) : ''}
                            </div>
                        </div>
                    </div>`;
                });
            }
            
            // Update total OTW di marquee
            const countOtwEl = document.getElementById('d-count-otw');
            if (countOtwEl) countOtwEl.innerText = otw;

            // Update Total BOP di header kanan
            const totalBopEl = document.getElementById('total-bop-amount');
            if (totalBopEl) {
                totalBopEl.innerText = `RP ${totalBopToday.toLocaleString('id-ID')}`;
            }
            
            if (typeof hitungUang === "function") {
                hitungUang(tb);
            }
        });
    </script>
</body>
</html>
