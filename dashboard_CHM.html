<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BBS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <!-- === CSS STYLING === -->
    <style>
        body {
            background-color: #0b132b;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Styling Welcome Screen */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0b132b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            gap: 20px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .welcome-title-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .welcome-subtitle {
            font-size: 16px;
            color: #00e5ff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .welcome-main-title {
            font-size: 32px;
            color: #ffd700;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            letter-spacing: 1px;
        }

        .btn-masuk {
            background: linear-gradient(135deg, #00e5ff, #00bcd4);
            color: #0b132b;
            border: none;
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-masuk:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(0, 229, 255, 0.6);
        }

        .view-container {
            display: none; 
            flex-direction: column;
            gap: 20px;
        }

        /* Header Dashboard */
        .dashboard-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            gap: 15px;
        }

        /* Teks Berjalan (Marquee) */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 10px 0;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .marquee-text {
            display: inline-block;
            animation: marquee 25s linear infinite;
            font-size: 16px;
            font-weight: bold;
            color: #ff9800;
            font-family: 'Poppins', sans-serif;
        }

        .marquee-text:hover {
            animation-play-state: paused;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        .neon-bullet {
            color: #00ff66;
            text-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
            animation: blink-neon 1.2s ease-in-out infinite;
        }

        @keyframes blink-neon {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 8px #00ff66, 0 0 15px #00ff66;
            }
            50% {
                opacity: 0.2;
                text-shadow: none;
            }
        }

        /* Wrapper Jam & Tanggal / Total BOP */
        .clock-date-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .left-info-group {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        #live-clock {
            font-size: 32px;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            letter-spacing: 1px;
            font-family: 'Orbitron', sans-serif;
            line-height: 1;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        #live-seconds {
            font-size: 16px;
            color: #00bcd4;
            font-weight: normal;
        }

        #live-date {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .right-bop-group {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 15px;
            border-radius: 8px;
            text-align: right;
        }

        .bop-title {
            font-size: 11px;
            color: #aaa;
            font-weight: bold;
            text-transform: uppercase;
        }

        #total-bop-amount {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* Header Section Pengirim */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* Tema Warna PT CHM (Cyan / Cool Blue) */
        .theme-chm {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.2), rgba(11, 19, 43, 0.8));
            border-left: 6px solid #00e5ff;
            color: #00e5ff;
        }

        /* Tema Warna H. MANYAR (Amber / Warm Gold) */
        .theme-manyar {
            background: linear-gradient(90deg, rgba(255, 152, 0, 0.2), rgba(11, 19, 43, 0.8));
            border-left: 6px solid #ff9800;
            color: #ff9800;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 1px;
        }

        .section-badge {
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Container Grid Unit */
        .log-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            padding: 10px;
            max-height: 48vh;
            overflow-y: auto;
            background: rgba(10, 15, 30, 0.6);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        #log-list-chm {
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        #log-list-manyar {
            border: 1px solid rgba(255, 152, 0, 0.2);
        }

        /* Scrollbar Styling */
        .log-grid::-webkit-scrollbar { width: 8px; }
        .log-grid::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        #log-list-chm::-webkit-scrollbar-thumb { background: #00e5ff; border-radius: 4px; }
        #log-list-manyar::-webkit-scrollbar-thumb { background: #ff9800; border-radius: 4px; }

        /* Kartu Unit */
        .truck-card {
            background: linear-gradient(135deg, rgba(20, 30, 48, 0.85), rgba(36, 59, 85, 0.85));
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
        }

        .truck-card.card-chm {
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
        .truck-card.card-chm:hover {
            transform: translateY(-3px);
            border-color: #00e5ff;
            box-shadow: 0 6px 15px rgba(0, 229, 255, 0.2);
        }

        .truck-card.card-manyar {
            border: 1px solid rgba(255, 152, 0, 0.2);
        }
        .truck-card.card-manyar:hover {
            transform: translateY(-3px);
            border-color: #ff9800;
            box-shadow: 0 6px 15px rgba(255, 152, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .sj-number-chm { font-size: 11px; font-weight: bold; color: #00e5ff; font-family: monospace; }
        .sj-number-manyar { font-size: 11px; font-weight: bold; color: #ff9800; font-family: monospace; }
        
        .info-waktu {
            font-size: 10px;
            color: #aaa;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 5px;
            border-radius: 3px;
        }

        .plat-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .plat-text { font-size: 15px; font-weight: bold; color: #FFF; }
        .project-badge { font-size: 10px; font-weight: bold; color: #ffd700; background: rgba(255, 215, 0, 0.15); padding: 1px 5px; border-radius: 3px; }

        .vol-row { display: flex; gap: 6px; margin-bottom: 8px; font-size: 11px; font-weight: bold; }
        .vol-m { color: #2ecc71; background: rgba(46, 204, 113, 0.1); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(46, 204, 113, 0.2); }
        .vol-b { color: #00e5ff; background: rgba(0, 229, 255, 0.1); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(0, 229, 255, 0.2); }

        .info-item { font-size: 12px; color: #ddd; margin-bottom: 4px; }
        .info-item.bop { color: #ffd700; }
        .info-item.jual { color: #00e5ff; }
        .info-item.margin { color: #2ecc71; }

        .foto-links { font-size: 11px; margin-top: 6px; margin-bottom: 8px; }
        .foto-links a { color: #4caf50; font-weight: bold; text-decoration: none; }
        .foto-links a:hover { text-decoration: underline; }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-otw {
            background: #FF9800;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn-otw:hover { background: #f57c00; }
        
        .badge-done {
            background: #4CAF50;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            display: block;
            width: 100%;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        .selisih-wrapper { width: 100%; text-align: center; font-size: 10px; }
    </style>
</head>
<body>

    <!-- Welcome Screen -->
    <div id="welcome-screen">
        <div class="welcome-title-group">
            <span class="welcome-subtitle">MONITORING TRUCK</span>
            <span class="welcome-main-title">PT. BERKAH BAJA STEEL</span>
        </div>
        <button id="btn-masuk-system" class="btn-masuk">MASUK SYSTEM</button>
    </div>

    <!-- Tampilan Mode Cilegon -->
    <div id="view-cilegon" class="view-container">
        <h2>Dashboard Cilegon</h2>
    </div>

    <!-- Tampilan Mode Utama -->
    <div id="view-dashboard" class="view-container">
        <!-- Header Utama -->
        <div class="dashboard-header">
            <div class="marquee-container">
                <div class="marquee-text">
                    MONITORING TRUCKING PT. BERKAH BAJA STEEL <span class="neon-bullet">&nbsp;&bull;&nbsp;</span> TOTAL TRUCK DIJALAN : ⟪ <span id="d-count-otw">0</span> UNIT ⟫ <span class="neon-bullet">&nbsp;&bull;&nbsp;</span> HARAP CEK BERKALA STATUS PENGIRIMAN UNIT
                </div>
            </div>
            
            <div class="clock-date-wrapper">
                <div class="left-info-group">
                    <div id="live-clock">
                        <span id="live-time-main">00.00</span><span id="live-seconds">.00</span>
                    </div>
                    <div id="live-date">--/--/----</div>
                </div>

                <div class="right-bop-group">
                    <div class="bop-title">Total BOP Hari Ini</div>
                    <div id="total-bop-amount">RP 0</div>
                </div>
            </div>
        </div>

        <!-- Section 1: Kiriman PT. CHM -->
        <div class="section-header theme-chm">
            <span class="section-title">PT. CHM</span>
            <span class="section-badge" id="badge-chm-info">0 Unit (OTW: 0)</span>
        </div>
        <div id="log-list-chm" class="log-grid"></div>

        <!-- Section 2: Kiriman H. MANYAR -->
        <div class="section-header theme-manyar">
            <span class="section-title">H. MANYAR</span>
            <span class="section-badge" id="badge-manyar-info">0 Unit (OTW: 0)</span>
        </div>
        <div id="log-list-manyar" class="log-grid"></div>
    </div>

    <!-- === JAVASCRIPT & FIREBASE SDK === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAfeLTKRQ66tjZjAt7tg6KcrWhtmv0y3fo", 
            databaseURL: "https://berkah-baja-steel-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "berkah-baja-steel" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyZhTJrSLlzeV8DyC1NcZciJyUrTLzMff5UahkTpZcDuF6PPX2o4E9Pc2K_guOhMjEh/exec";

        // Fitur Fullscreen & Navigasi
        document.getElementById('btn-masuk-system').addEventListener('click', () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log("Fullscreen error:", err));
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }

            document.getElementById('welcome-screen').style.display = 'none';

            const mode = new URLSearchParams(window.location.search).get('mode');
            if(mode === 'cilegon') {
                document.getElementById('view-cilegon').style.display = 'flex';
            } else {
                document.getElementById('view-dashboard').style.display = 'flex';
            }
        });

        // Live Clock & Date
        function updateClockAndDate() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('live-time-main').innerText = `${hours}.${minutes}`;
            document.getElementById('live-seconds').innerText = `.${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', options);
        }
        updateClockAndDate();
        setInterval(updateClockAndDate, 1000);

       // State Global untuk akumulasi gabungan
let stateCHM = { otw: 0, bop: 0, count: 0 };
let stateMANYAR = { otw: 0, bop: 0, count: 0 };

function updateCombinedSummary() {
    const totalOtw = stateCHM.otw + stateMANYAR.otw;
    const totalBop = stateCHM.bop + stateMANYAR.bop;

    const countOtwEl = document.getElementById('d-count-otw');
    if (countOtwEl) countOtwEl.innerText = totalOtw;

    const totalBopEl = document.getElementById('total-bop-amount');
    if (totalBopEl) {
        totalBopEl.innerText = `RP ${totalBop.toLocaleString('id-ID')}`;
    }

    const badgeChm = document.getElementById('badge-chm-info');
    if (badgeChm) badgeChm.innerText = `${stateCHM.count} Unit (OTW: ${stateCHM.otw})`;
    
    const badgeManyar = document.getElementById('badge-manyar-info');
    if (badgeManyar) badgeManyar.innerText = `${stateMANYAR.count} Unit (OTW: ${stateMANYAR.otw})`;
}

// Render Card Generator
function renderCards(data, targetContainerId, dbKey, isManyar = false) {
    const list = document.getElementById(targetContainerId);
    if (!list) return { otw: 0, totalBop: 0, count: 0 };
    list.innerHTML = "";

    let tm = 0, tb = 0, otw = 0, totalBop = 0, count = 0;
    if (!data) return { otw, totalBop, count };

    const romawiBulan = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
    const d = new Date();
    const bulanRomawi = romawiBulan[d.getMonth()];
    const tahunSekarang = d.getFullYear();

    const keys = Object.keys(data);
    const totalData = keys.length;

    // 🚀 DIBALIK URUTANNYA AGAR DATA TERBARU MUNCUL DI PALING ATAS
    keys.reverse().forEach((k, index) => {
        const i = data[k];
        const statusMobil = (i.status || "").toUpperCase();
        
        if(statusMobil === 'ARCHIVE') return;

        count++;
        tm += Number(i.volM || 0); 
        tb += Number(i.volB || 0); 
        totalBop += Number(i.bop_unit || 0);
        
        let statusElement = "";
        if(statusMobil === 'OTW') {
            otw++;
            statusElement = `
                <button onclick="openOtwManager('${k}', '${i.plat}')" class="btn-otw">
                    ${statusMobil} ( PROSES BONGKAR )
                </button>
            `;
        } else {
            statusElement = `
                <span class="badge-done">
                    ✅ ${i.status}
                </span>
            `;
        }

        let nomorSuratJalanLengkap = i.noSuratJalan || i.nomor_surat_jalan || i.surat_jalan || i.no_sj;
        if (!nomorSuratJalanLengkap || nomorSuratJalanLengkap === '-' || nomorSuratJalanLengkap.includes('000/bbs')) {
            // Menjaga agar penomoran otomatis tetap konsisten sesuai urutan kronologis
            const safeNo = totalData - index;
            const stringNomorUrut = String(safeNo).padStart(3, '0');
            const prefix = isManyar ? 'MYR' : 'BBS';
            nomorSuratJalanLengkap = `${stringNomorUrut}/${prefix}/${bulanRomawi}/${tahunSekarang}`;
        }
        
        const jamMuat = i.jamM || i.jam_muat || i.jam || '';
        const tglMuat = i.tgl || i.tglM || i.tanggal || '-';
        const infoWaktu = jamMuat ? `${jamMuat} ※ ${tglMuat}` : tglMuat;

        const cardThemeClass = isManyar ? 'card-manyar' : 'card-chm';
        const sjThemeClass = isManyar ? 'sj-number-manyar' : 'sj-number-chm';
        
        list.innerHTML += `
        <div class="truck-card ${cardThemeClass}">
            <div class="card-header">
                <span class="${sjThemeClass}">${nomorSuratJalanLengkap}</span>
                <span class="info-waktu">${infoWaktu}</span>
            </div>

            <div class="card-body">
                <div class="plat-row">
                    <span class="plat-text">${i.plat}</span> 
                    <span class="project-badge">[${i.project || (isManyar ? 'MANYAR' : 'LOSARANG')}]</span>
                </div>

                <div class="vol-row">
                    <span class="vol-m">VOL M : ${i.volM || 0} M³</span>
                    <span class="vol-b">VOL B : ${i.volB || 0} M³</span>
                </div>
                
                <div class="info-item">
                    MUATAN <b>${i.barang ? i.barang.toUpperCase() : '-'}</b>
                </div>

                <div class="info-item">
                    PENGEMUDI : <b>${i.sopir || '-'}</b>
                </div>

                <div class="info-item bop">
                    💰 BOP : RP ${(i.bop_unit || 0).toLocaleString('id-ID')}
                </div>

                <div class="info-item jual">
                    🏷️ HARGA JUAL : RP ${(i.harga_jual || i.hargaJual || i.harga || 0).toLocaleString('id-ID')}
                </div>
                
                ${i.margin_per_unit ? `
                <div class="info-item margin">
                    📈 MARGIN : RP ${i.margin_per_unit.toLocaleString('id-ID')}
                </div>
                ` : ''}
                
                <div class="foto-links">
                    ${i.fotoM ? `<a href="${i.fotoM}" target="_blank">📄 FOTO LOADING</a>` : ''} 
                    ${i.fotoB ? `| <a href="${i.fotoB}" target="_blank">📄 FOTO BONGKAR</a>` : ''}
                </div>
            </div>
            
            <div class="card-footer">
                ${statusElement}
                <div class="selisih-wrapper">
                    ${typeof getBadgeSelisih === 'function' ? getBadgeSelisih(i) : ''}
                </div>
            </div>
        </div>`;
    });

    return { otw, totalBop, count };
}

// Listener Real-time Firebase 1: CHM1
onValue(ref(db, `bbs_logs/CHM1`), (snap) => {
    const result = renderCards(snap.val(), 'log-list-chm', 'CHM1', false);
    stateCHM.otw = result.otw;
    stateCHM.bop = result.totalBop;
    stateCHM.count = result.count;
    updateCombinedSummary();
});

// Listener Real-time Firebase 2: MANYAR
onValue(ref(db, `bbs_logs/MANYAR`), (snap) => {
    const result = renderCards(snap.val(), 'log-list-manyar', 'MANYAR', true);
    stateMANYAR.otw = result.otw;
    stateMANYAR.bop = result.totalBop;
    stateMANYAR.count = result.count;
    updateCombinedSummary();
});
    </script>
</body>
</html>
